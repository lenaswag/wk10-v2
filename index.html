
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Missing Trophy Mystery | Detective Adventure</title>
<style>
:root{
  --navy:#243b60;
  --blue:#438de2;
  --blue-dark:#2866b6;
  --sky:#e8f4ff;
  --yellow:#ffd56b;
  --coral:#ff8d7b;
  --cream:#fffaf0;
  --white:#fff;
  --line:#dce7f3;
  --mint:#dff7ed;
  --green:#258b72;
  --red:#d85d60;
  --shadow:0 10px 30px rgba(34,61,99,.11);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:#eaf3fc;
  color:var(--navy);
  font-family:"Trebuchet MS",Arial,"Malgun Gothic",sans-serif;
  line-height:1.6;
}
button,textarea,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.48;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{
  outline:3px solid #f3a52f;
  outline-offset:3px;
}
#app{max-width:1160px;margin:auto;padding:12px}
.shell{
  background:var(--cream);
  border:3px solid white;
  border-radius:28px;
  overflow:hidden;
  min-height:680px;
  box-shadow:var(--shadow);
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  background:white;
  padding:13px 20px;
  border-bottom:2px solid var(--line);
}
.brand{font-weight:900;font-size:17px}
.stats{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill{
  border:0;
  border-radius:30px;
  padding:7px 12px;
  background:var(--sky);
  font-weight:900;
  color:var(--navy);
  font-size:13px;
}
.sound{background:#fff0ce}
.progress{height:9px;background:#e3ebf5}
.progress>div{
  height:100%;
  background:linear-gradient(90deg,var(--blue),#7ac5ef);
  transition:width .4s;
}
.content{max-width:1020px;margin:auto;padding:24px}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(30px,5vw,48px);line-height:1.2}
h2{font-size:clamp(23px,3.5vw,33px)}
h3{font-size:20px}
h1,h2,h3{font-weight:900}
.center{text-align:center}
.muted{color:#647b99}
.tag{
  display:inline-block;
  background:#fff0c8;
  color:#93630e;
  border-radius:30px;
  padding:5px 14px;
  font-size:12px;
  font-weight:900;
  margin-bottom:10px;
}
.btn{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:15px;
  padding:13px 22px;
  font-weight:900;
  box-shadow:0 5px 0 var(--blue-dark);
  transition:transform .15s;
}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn.yellow{
  background:var(--yellow);
  color:var(--navy);
  box-shadow:0 5px 0 #d5a542;
}
.btn.coral{
  background:var(--coral);
  box-shadow:0 5px 0 #cb6655;
}
.btn.green{
  background:var(--green);
  box-shadow:0 5px 0 #176f59;
}
.btn.outline{
  background:white;
  color:var(--navy);
  border:2px solid var(--line);
  box-shadow:none;
}
.btn.small{font-size:13px;padding:9px 15px}
.panel{
  background:white;
  border:2px solid var(--line);
  border-radius:21px;
  padding:20px;
  box-shadow:var(--shadow);
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:19px}
.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.space{justify-content:space-between}
.note{
  background:#fff5dc;
  border-left:5px solid var(--yellow);
  padding:13px;
  border-radius:11px;
}
.grammar{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin:20px 0;
}
.grammar span{
  padding:12px 19px;
  border:2px solid #bedcff;
  border-radius:13px;
  background:var(--sky);
  font-weight:900;
}
.grammar span:last-child{
  background:#fff0c9;
  border-color:#f2d38b;
}
.mapcards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.mapcard{
  background:white;
  border:2px solid var(--line);
  border-radius:16px;
  padding:12px;
  text-align:center;
  font-weight:800;
}
.mapcard.current{background:var(--sky);border-color:var(--blue)}
.mapcard.complete{background:var(--mint);border-color:#4db497}
.mapcard.locked{opacity:.5}
.mapcard .emoji{font-size:30px}
.roomlayout{
  display:grid;
  grid-template-columns:1.6fr 1fr;
  gap:20px;
}
.scene{
  position:relative;
  aspect-ratio:16/9;
  overflow:hidden;
  border:5px solid white;
  border-radius:22px;
  background:#d8ecff;
  box-shadow:var(--shadow);
}
.scene svg{width:100%;height:100%;display:block}
.scene .object{
  cursor:pointer;
  transition:filter .2s;
}
.scene .object:hover,
.scene .object:focus{
  filter:drop-shadow(0 0 10px #ffe28a);
}
.scene .object:focus{outline:none}
.scene .object:not(.done){
  animation:objectGlow 2.4s ease-in-out infinite;
}
.scene .object.done{
  opacity:.55;
  cursor:default;
  animation:none;
}
.scene .object.done:hover{filter:none}
@keyframes objectGlow{
  0%,100%{filter:drop-shadow(0 0 2px #ffffff88)}
  50%{filter:drop-shadow(0 0 12px #ffe06e)}
}
.scene-label{
  position:absolute;
  left:12px;
  bottom:12px;
  background:#ffffffed;
  border-radius:12px;
  padding:7px 12px;
  font-weight:800;
  font-size:12px;
  pointer-events:none;
}
.scene-guide{
  text-align:center;
  color:#607b9b;
  margin-top:10px;
  font-size:14px;
}
.logitem{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:10px;
  border-bottom:1px solid var(--line);
}
.evidence{
  background:#fff9e9;
  border:2px dashed #e4bd69;
  border-radius:15px;
  padding:14px;
  margin-top:16px;
}
.evidence.locked{
  background:#f2f5f8;
  border-color:#cbd4dd;
  color:#8390a0;
}
.evidence p{margin:5px 0 0;font-size:14px}
.overlay{
  position:fixed;
  inset:0;
  z-index:50;
  background:#172b47aa;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}
.modal{
  width:min(620px,100%);
  max-height:94vh;
  overflow:auto;
  background:white;
  border:4px solid #fff7e6;
  border-radius:24px;
  padding:23px;
  box-shadow:0 25px 75px #10233c66;
  animation:pop .3s ease-out;
}
@keyframes pop{
  from{opacity:0;transform:scale(.87) translateY(15px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.object-preview{
  background:linear-gradient(145deg,#e9f5ff,#fff7e7);
  border-radius:18px;
  min-height:180px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:12px 0;
  padding:14px;
}
.object-preview svg{width:200px;height:160px;max-width:100%}
.inspect-label{
  text-align:center;
  font-size:20px;
  font-weight:900;
  margin:6px 0;
}
.question h3{
  font-size:clamp(20px,3vw,25px);
  margin:12px 0 20px;
}
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}
.option,.word{
  background:#f2f8ff;
  border:2px solid #d5e5f6;
  color:var(--navy);
  border-radius:13px;
  padding:12px;
  font-size:17px;
  font-weight:800;
  min-height:51px;
}
.option:hover:not(:disabled),
.word:hover:not(:disabled){
  background:#e3f1ff;
  border-color:#82b5eb;
}
.option.selected{
  background:#ffe8b5;
  border-color:#e7ad48;
}
.answerarea{
  background:#f0f7ff;
  border:2px dashed #a9cdeb;
  border-radius:15px;
  min-height:78px;
  padding:15px;
  margin:15px 0;
}
.answerarea .word{
  background:#fff0c7;
  border-color:#e5c36b;
}
.wordbank{display:flex;flex-wrap:wrap;gap:9px}
.word{font-size:15px;padding:9px 14px;min-height:44px}
.sentence{
  background:#f3f8ff;
  padding:15px;
  border-radius:13px;
  font-size:20px;
  font-weight:800;
  line-height:2.5;
}
.token{
  display:inline-block;
  background:#fff0c9;
  border:2px solid #f0d08d;
  border-radius:9px;
  padding:0 7px;
  margin:3px;
  color:var(--navy);
  font-weight:800;
}
.token.selected{
  background:#ffbcb0;
  border-color:#ed7b6b;
}
.feedback{
  border-radius:13px;
  padding:13px 16px;
  margin-top:15px;
  background:#e9f4ff;
  font-size:14px;
}
.feedback.success{background:#dff8ec}
.feedback.error{background:#fff0df}
.feedback strong{display:block;font-size:16px}
.dossier{
  background:#fffdf4;
  border:2px solid #e5d2a5;
  border-radius:15px;
  padding:15px;
  margin:10px 0;
}
.dossier .num{
  font-size:11px;
  color:#a27a31;
  font-weight:900;
}
.dossier p{margin:4px 0 0;font-weight:800}
.envelope{
  width:190px;
  height:120px;
  margin:20px auto;
  position:relative;
  background:#edc177;
  border-radius:8px;
  box-shadow:0 8px 20px #72512c33;
  animation:envelopeRise .65s ease-out;
}
.envelope:before{
  content:"";
  position:absolute;
  inset:0;
  background:#f5d59b;
  clip-path:polygon(0 0,50% 57%,100% 0);
}
.envelope:after{
  content:"🔑";
  position:absolute;
  left:50%;
  top:55%;
  transform:translate(-50%,-50%);
  font-size:35px;
}
@keyframes envelopeRise{
  from{transform:translateY(60px) scale(.6);opacity:0}
  to{transform:translateY(0) scale(1);opacity:1}
}
.starburst{
  position:fixed;
  inset:0;
  z-index:100;
  pointer-events:none;
  overflow:hidden;
}
.star{
  position:absolute;
  top:50%;
  left:50%;
  font-size:28px;
  animation:starFly .9s ease-out forwards;
}
@keyframes starFly{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  20%{opacity:1}
  100%{
    opacity:0;
    transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(220deg) scale(1.2);
  }
}
.trophy-svg{width:170px;display:block;margin:12px auto}
.trophy-reveal{animation:trophyReveal 1s ease-out}
@keyframes trophyReveal{
  0%{opacity:0;transform:scale(.25) rotate(-15deg)}
  60%{opacity:1;transform:scale(1.15) rotate(5deg)}
  100%{transform:scale(1) rotate(0)}
}

/* REPORT WRITING */
.report-layout{
  display:grid;
  grid-template-columns:1fr 1.3fr;
  gap:19px;
}
.report-paper{
  background:#fff;
  border:2px solid #d6e3f0;
  border-radius:19px;
  padding:22px;
  box-shadow:var(--shadow);
}
.report-heading{
  border-bottom:3px solid #f0c970;
  padding-bottom:12px;
  margin-bottom:18px;
}
.report-input{
  width:100%;
  min-height:190px;
  padding:15px 15px 15px 18px;
  border:2px solid #cadbec;
  border-radius:13px;
  resize:vertical;
  background:repeating-linear-gradient(
    to bottom,
    #fff,
    #fff 34px,
    #e5edf7 35px,
    #fff 36px
  );
  color:var(--navy);
  font-size:17px;
  line-height:36px;
}
.report-input:focus{border-color:var(--blue)}
.report-name{
  width:100%;
  padding:11px 13px;
  border:2px solid #cadbec;
  border-radius:11px;
  color:var(--navy);
  background:white;
}
.report-stat{
  background:#eef6ff;
  border-radius:10px;
  padding:10px 13px;
  font-size:13px;
  font-weight:800;
}
.checklist{
  display:grid;
  gap:12px;
  margin:18px 0;
}
.checkrow{
  display:flex;
  align-items:flex-start;
  gap:11px;
  background:#f5f9ff;
  border:2px solid #e1eaf4;
  border-radius:13px;
  padding:13px;
  cursor:pointer;
}
.checkrow input{
  width:20px;
  height:20px;
  flex:none;
  margin-top:3px;
  accent-color:var(--blue);
}
.checkrow span{font-size:15px}
.certificate{
  position:relative;
  background:#fffdf6;
  border:9px double #d9ad4c;
  border-radius:18px;
  padding:35px 24px;
  text-align:center;
  overflow:hidden;
}
.certificate:before,
.certificate:after{
  content:"✦";
  position:absolute;
  color:#e2b95e;
  font-size:50px;
}
.certificate:before{top:15px;left:22px}
.certificate:after{bottom:15px;right:22px}
.certificate h1{
  font-family:Georgia,serif;
  font-size:clamp(27px,4vw,42px);
  color:#956d24;
}
.cert-name{
  display:inline-block;
  min-width:220px;
  max-width:100%;
  border-bottom:2px solid #d9ad4c;
  padding:9px 15px;
  font-size:clamp(23px,4vw,32px);
  font-weight:900;
  overflow-wrap:anywhere;
}
.cert-seal{
  width:105px;
  height:105px;
  border:6px double #d7a83c;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:18px auto;
  background:#fff0c4;
  font-size:49px;
  animation:pop .5s ease-out;
}
.result{
  background:#fff3d5;
  border:3px solid #f1d17d;
  border-radius:23px;
  padding:22px;
  text-align:center;
}
.footer{
  text-align:center;
  color:#8795a8;
  font-size:12px;
  padding:16px;
}
@media(max-width:760px){
  #app{padding:5px}
  .content{padding:15px}
  .roomlayout,.grid2,.report-layout{grid-template-columns:1fr}
  .scene{aspect-ratio:4/3}
  .brand{font-size:14px}
  .pill{font-size:11px;padding:5px 8px}
  .mapcard{padding:8px 4px;font-size:12px}
  .mapcard .emoji{font-size:25px}
  .modal{padding:16px}
  .option{font-size:15px;padding:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
@media print{
  body{background:white}
  #app{padding:0;max-width:none}
  .shell{border:0;box-shadow:none;min-height:0}
  .topbar,.progress,.footer,.no-print{display:none!important}
  .content{padding:0;max-width:none}
  .certificate{margin:30px auto;max-width:850px;break-inside:avoid}
  .print-report{display:block!important;margin:30px auto;max-width:850px;white-space:pre-wrap}
}
</style>

<body>
<div id="app"></div>

<script>
"use strict";

/* =========================================
   THE MISSING TROPHY MYSTERY
   Grade 6 · Passive Voice · 15 minutes

   6 controlled grammar questions
   2 evidence-based final questions
   1 guided free-writing report
   1 self-check
   1 completion certificate

   Single-file HTML / CSS / JavaScript
   Inline SVG illustrations
   Web Audio API sound effects
========================================= */

const app=document.getElementById("app");

/* SOUND */
let soundEnabled=true;
let audioContext=null;

function getAudio(){
  if(!soundEnabled)return null;
  try{
    if(!audioContext){
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx)return null;
      audioContext=new Ctx();
    }
    if(audioContext.state==="suspended")audioContext.resume();
    return audioContext;
  }catch(e){return null}
}
function tone(freq,duration=.12,type="sine",volume=.07,delay=0){
  const ctx=getAudio();
  if(!ctx)return;
  try{
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    const start=ctx.currentTime+delay;
    osc.type=type;
    osc.frequency.setValueAtTime(freq,start);
    gain.gain.setValueAtTime(.001,start);
    gain.gain.exponentialRampToValueAtTime(volume,start+.015);
    gain.gain.exponentialRampToValueAtTime(.001,start+duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start+duration+.02);
  }catch(e){}
}
function sfx(name){
  if(!soundEnabled)return;
  if(name==="click")tone(490,.07,"sine",.035);
  if(name==="inspect"){
    tone(440,.10,"triangle",.05);
    tone(660,.13,"triangle",.05,.10);
  }
  if(name==="correct"){
    tone(523,.12,"sine",.07);
    tone(659,.12,"sine",.07,.13);
    tone(784,.22,"sine",.08,.26);
  }
  if(name==="wrong"){
    tone(330,.13,"triangle",.04);
    tone(260,.18,"triangle",.035,.14);
  }
  if(name==="clue"){
    [523,659,784,1047].forEach((f,i)=>tone(f,.2,"sine",.06,i*.13));
  }
  if(name==="victory"){
    [523,659,784,1047,1318,1568].forEach((f,i)=>tone(f,.24,"triangle",.06,i*.14));
  }
}
function toggleSound(){
  soundEnabled=!soundEnabled;
  if(soundEnabled)sfx("click");
  render();
}

/* STORY
   Evidence 1: The trophy was put inside a large box.
   Evidence 2: The trophy box was carried to the library.
   Evidence 3: The box was placed behind the science books.
   The trophy's location follows from these clues.
   No culprit is invented.
*/

const clues=[
  "The trophy was put inside a large box after school.",
  "The trophy box was carried into the library.",
  "The box was placed behind the science books."
];
const clueKorean=[
  "트로피가 방과 후 큰 상자 안에 넣어졌어요.",
  "트로피가 든 상자가 도서관으로 옮겨졌어요.",
  "그 상자가 과학책 뒤에 놓였어요."
];

const rooms=[
  {
    name:"The Classroom",ko:"교실",icon:"🏫",
    intro:"교실의 책상과 창문을 직접 클릭해 조사하세요.",
    objects:[
      {name:"Desk",ko:"책상"},
      {name:"Window",ko:"창문"}
    ],
    questions:[
      {
        type:"choice",
        prompt:"The desks ___ cleaned every day.",
        choices:["is","are","was","were"],
        answer:1,
        explanation:"desks는 복수이고 every day는 현재의 반복을 나타내므로 are cleaned가 맞아요."
      },
      {
        type:"choice",
        prompt:"The window ___ broken yesterday.",
        choices:["is","are","was","were"],
        answer:2,
        explanation:"window는 단수이고 yesterday는 과거를 나타내므로 was broken이 맞아요."
      }
    ]
  },
  {
    name:"The Art Room",ko:"미술실",icon:"🎨",
    intro:"그림과 상자를 조사하고 능동태 문장을 수동태로 바꿔보세요.",
    objects:[
      {name:"Painting",ko:"그림"},
      {name:"Box",ko:"상자"}
    ],
    questions:[
      {
        type:"build",
        prompt:"Emma painted the picture.",
        prefix:"The picture",
        words:["is","painted","by Emma","was"],
        answer:["was","painted","by Emma"],
        explanation:"과거의 행동이므로 The picture was painted by Emma.가 맞아요."
      },
      {
        type:"build",
        prompt:"The teacher opened the box.",
        prefix:"The box",
        words:["opened","was","opens","by the teacher"],
        answer:["was","opened","by the teacher"],
        explanation:"opened는 과거의 행동이므로 was opened가 맞아요."
      }
    ]
  },
  {
    name:"The Library",ko:"도서관",icon:"📚",
    intro:"책장과 문을 조사하고 잘못된 수동태 문장을 수정하세요.",
    objects:[
      {name:"Books",ko:"책장"},
      {name:"Door",ko:"문"}
    ],
    questions:[
      {
        type:"error",
        tokens:["The","books","is","arranged","every","morning."],
        wrong:2,
        choices:["are","was","be","were"],
        answer:0,
        explanation:"books는 복수이고 every morning은 현재의 반복이므로 are arranged가 맞아요."
      },
      {
        type:"error",
        tokens:["The","door","was","lock","yesterday."],
        wrong:3,
        choices:["locking","locked","locks","lock"],
        answer:1,
        explanation:"수동태는 be + 과거분사이므로 was locked가 맞아요."
      }
    ]
  }
];

const finals=[
  {
    prompt:"Where was the trophy put after school?",
    choices:["Inside a large box","Under a desk","Behind a window","On a classroom board"],
    answer:0,
    explanation:"Evidence 1에 트로피가 큰 상자 안에 넣어졌다고 나와 있어요."
  },
  {
    prompt:"Where was the trophy box placed?",
    choices:["Under the classroom desk","Behind the science books","Near the art room window","Inside the cafeteria"],
    answer:1,

function escapeHTML(v){
  return String(v).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}
function solvedCount(){
  return state.solved.reduce((n,a)=>n+a.length,0)+state.finalSolved.length;
}
function progressPercent(){
  const base=solvedCount()/8*78;
  if(state.screen==="report")return 82;
  if(state.screen==="selfcheck")return 91;
  if(state.screen==="certificate")return 100;
  return base;
}

}
function layout(content){

function render(){

  if(state.screen==="room")return renderRoom();
  if(state.screen==="finalIntro")return finalIntro();
  if(state.screen==="final")return renderFinal();
  if(state.screen==="report")return renderReport();
  if(state.screen==="selfcheck")return renderSelfCheck();

/* ANIMATION */
function stars(){
  const layer=document.createElement("div");
  layer.className="starburst";
  const symbols=["⭐","✨","🌟","⭐","✨","🌟","⭐","✨"];
  symbols.forEach((symbol,i)=>{
    const star=document.createElement("span");
    star.className="star";
    star.textContent=symbol;
    const angle=Math.PI*2*i/symbols.length;
    const distance=130+Math.random()*110;
    star.style.setProperty("--x",Math.cos(angle)*distance+"px");
    star.style.setProperty("--y",Math.sin(angle)*distance+"px");
    layer.appendChild(star);
  });
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(),1000);
}

function inspect(index){
  if(state.solved[state.room].includes(index))return;
  sfx("inspect");
  state.current=index;
  state.selectedWords=[];
  state.selectedError=null;
  state.selectedOption=null;
  state.correct=false;
  state.feedback="";
  state.questionTries=0;
  state.hintUsed=false;
  showInspection();
}
function removeOverlay(){
  document.getElementById("gameOverlay")?.remove();

function showInspection(){
  const o=rooms[state.room].objects[state.current];

      <div class="modal center">

          <button class="word" onclick="addWord(${i})"
            ${state.correct||state.selectedWords.includes(w)?"disabled":""}>
            ${escapeHTML(w)}
          </button>
        `).join("")}
      </div>
      <div style="margin-top:13px">
        <button class="btn outline small" onclick="clearWords()"
          ${state.correct?"disabled":""}>↺ 다시 조립하기</button>
      </div>
    `;
  }else{
    body=`
      <p class="muted">틀린 단어를 먼저 클릭한 다음 올바른 표현을 선택하세요.</p>
      <div class="sentence">
        ${q.tokens.map((t,i)=>`
          <button class="token ${state.selectedError===i?"selected":""}"
            onclick="selectError(${i})" ${state.correct?"disabled":""}>
            ${escapeHTML(t)}
          </button>
        `).join(" ")}
      </div>
      ${state.selectedError!==null?`
        <p style="margin:15px 0 8px"><b>어떤 단어로 고칠까요?</b></p>
        <div class="options">
          ${q.choices.map((c,i)=>`
            <button class="option ${state.selectedOption===i?"selected":""}"
              onclick="chooseOption(${i})" ${state.correct?"disabled":""}>
              ${escapeHTML(c)}
            </button>
          `).join("")}
        </div>
      `:""}
    `;
  }

  const canCheck=q.type==="build"
    ?state.selectedWords.length===q.answer.length
    :q.type==="error"
      ?state.selectedError!==null&&state.selectedOption!==null
      :state.selectedOption!==null;

  removeOverlay();
  document.body.insertAdjacentHTML("beforeend",`
    <div class="overlay" id="gameOverlay">
      <div class="modal">
        <div class="flex space">
          <span class="tag">🔍 ${escapeHTML(rooms[state.room].objects[state.current].name)}</span>
          <span class="muted">MISSION ${state.room+1}</span>
        </div>
        <div class="question">${body}</div>
        ${state.feedback?`
          <div class="feedback ${state.correct?"success":"error"}">
            <strong>${state.correct?"🌟 Excellent!":"💡 다시 생각해보세요!"}</strong>
            ${escapeHTML(state.feedback)}
          </div>
        `:""}
        <div class="flex" style="justify-content:flex-end;margin-top:18px">
          ${state.correct?`
            <button class="btn green" onclick="completeQuestion()">조사 완료 ✓</button>
          `:`
            <button class="btn outline small" onclick="showHint()">💡 힌트</button>
            <button class="btn" onclick="checkAnswer()" ${canCheck?"":"disabled"}>정답 확인 →</button>
          `}
        </div>
      </div>
    </div>
  `);
}
function chooseOption(i){
  if(state.correct)return;
  sfx("click");
  state.selectedOption=i;
  showQuestion();
}
function addWord(i){
  if(state.correct)return;
  const w=currentQuestion().words[i];
  if(state.selectedWords.includes(w))return;
  sfx("click");
  state.selectedWords.push(w);
  showQuestion();
}
function removeWord(i){
  if(state.correct)return;
  sfx("click");
  state.selectedWords.splice(i,1);
  showQuestion();
}
function clearWords(){
  if(state.correct)return;
  sfx("click");
  state.selectedWords=[];
  state.feedback="";
  showQuestion();
}
function selectError(i){
  if(state.correct)return;
  sfx("click");
  state.selectedError=i;
  state.selectedOption=null;
  showQuestion();
}
function showHint(){
  state.hintUsed=true;
  const q=currentQuestion();
  state.feedback=q.type==="choice"
    ?"주어가 단수인지 복수인지 확인하고 every day, yesterday 같은 시간 표현을 살펴보세요."
    :q.type==="build"
      ?"행동을 받는 대상을 주어로 놓고, 시제에 맞는 be동사와 과거분사를 사용하세요."
      :"be동사가 주어와 시제에 맞는지, 일반동사가 과거분사 형태인지 확인하세요.";
  showQuestion();
}
function checkAnswer(){
  const q=currentQuestion();
  let ok=false;

  if(q.type==="choice")ok=state.selectedOption===q.answer;
  if(q.type==="build"){
    ok=JSON.stringify(state.selectedWords)===JSON.stringify(q.answer);
  }
  if(q.type==="error"){
    ok=state.selectedError===q.wrong&&state.selectedOption===q.answer;
  }

  state.questionTries++;

  if(ok){
    sfx("correct");
    stars();
    state.correct=true;
    state.score+=state.questionTries===1&&!state.hintUsed?100:70;
    if(state.questionTries===1&&!state.hintUsed)state.firstTry++;
    state.feedback=q.explanation;
  }else{
    sfx("wrong");
    state.mistakes.push({room:state.room,type:q.type});
    state.feedback=q.type==="error"
      ?"틀린 단어의 위치와 올바른 형태를 다시 확인해 보세요."
      :q.type==="build"
        ?"문장 순서와 be동사의 시제를 다시 확인해 보세요."
        :"주어의 수와 시간 표현을 다시 확인해 보세요.";
    state.selectedOption=null;
    if(q.type==="error")state.selectedError=null;
    if(q.type==="build")state.selectedWords=[];
  }
  showQuestion();
}
function completeQuestion(){
  if(!state.correct)return;
  sfx("click");
  removeOverlay();
  state.solved[state.room].push(state.current);

  if(state.solved[state.room].length===2){
    state.clues[state.room]=true;
    renderRoom();
    showClue();
  }else renderRoom();
}
function showClue(){
  sfx("clue");
  stars();
  const i=state.room;
  removeOverlay();
  document.body.insertAdjacentHTML("beforeend",`
    <div class="overlay" id="gameOverlay">
      <div class="modal center">
        <span class="tag">EVIDENCE UNLOCKED!</span>
        <h2>새로운 단서 발견!</h2>
        <div class="envelope"></div>
        <div class="dossier">
          <div class="num">🗝️ EVIDENCE ${i+1}</div>
          <p>${escapeHTML(clues[i])}</p>
        </div>
        <p>${escapeHTML(clueKorean[i])}</p>
        <button class="btn yellow" onclick="closeClue()">수사 계속하기 →</button>
      </div>
    </div>
  `);
}
function closeClue(){
  sfx("click");
  removeOverlay();
}
function nextRoom(){
  if(state.solved[state.room].length!==2)return;
  sfx("inspect");
  if(state.room<2){
    state.room++;
    renderRoom();
  }else{
    state.screen="finalIntro";
    render();
  }
}

function selectFinal(i){

  renderFinal();
}
function finalHint(){
  state.hintUsed=true;
  state.feedback=state.finalIndex===0
    ?"첫 번째 단서에서 트로피가 어디에 넣어졌는지 확인하세요."
    :"두 번째와 세 번째 단서를 연결해 보세요.";
  renderFinal();
}
function checkFinal(){
  if(state.selectedOption===null||state.finalChecked)return;
  const q=finals[state.finalIndex];
  state.questionTries++;

  if(state.selectedOption===q.answer){
    sfx("correct");
    stars();
    state.finalChecked=true;
    state.feedback=q.explanation;
    state.finalSolved.push(state.finalIndex);
    state.score+=state.questionTries===1&&!state.hintUsed?100:70;
    if(state.questionTries===1&&!state.hintUsed)state.firstTry++;
  }else{
    sfx("wrong");
    state.mistakes.push({room:3,type:"clue"});
    state.feedback="아직 정답이 아니에요. Evidence Board의 단서를 다시 살펴보세요!";
    state.selectedOption=null;
  }
  renderFinal();
}
function nextFinal(){
  if(!state.finalChecked)return;
  sfx("click");
  if(state.finalIndex<1){
    state.finalIndex++;
    state.selectedOption=null;
    state.finalChecked=false;
    state.feedback="";
    state.questionTries=0;
    state.hintUsed=false;
    renderFinal();
  }else{
    state.screen="report";
    sfx("clue");
    render();
  }
}

/* FREE WRITING REPORT */
function sentenceCount(text){
  return text.trim()
    ?text.trim().split(/[.!?]+/).filter(s=>s.trim()).length
    :0;
}
function wordCount(text){
  return text.trim()?text.trim().split(/\s+/).length:0;
}

function updateName(value){
  state.detectiveName=value;

}
function updateReport(value){

  updateReportUI();
}
function canProceedReport(){
  return state.detectiveName.trim().length>0
    &&sentenceCount(state.report)>=3
    &&wordCount(state.report)>=15;
}
function updateReportUI(){
  const stats=document.getElementById("reportStats");
  const button=document.getElementById("reviewButton");
  const help=document.getElementById("reportHelp");
  if(stats){
    stats.textContent=
      sentenceCount(state.report)+" sentences · "+
      wordCount(state.report)+" words";
  }
  if(button)button.disabled=!canProceedReport();
  if(help){
    help.textContent=canProceedReport()
      ?"보고서를 확인하고 다음 단계로 이동하세요."
      :"이름, 영어 문장 3개 이상, 총 15단어 이상을 작성하세요.";
  }
}
async function copyReport(){
  const text=
    "FINAL CASE REPORT\n"+
    "Detective: "+state.detectiveName+"\n\n"+
    state.report;
  try{
    await navigator.clipboard.writeText(text);
    alert("보고서가 복사되었어요!");
  }catch(e){
    const temp=document.createElement("textarea");
    temp.value=text;
    document.body.appendChild(temp);
    temp.select();
    try{
      document.execCommand("copy");
      alert("보고서가 복사되었어요!");
    }catch(err){
      alert("복사할 수 없어요. 보고서 내용을 직접 선택해 복사해 주세요.");
    }
    temp.remove();
  }
}
function goSelfCheck(){

        <button class="btn yellow" onclick="window.print()">🖨️ 자격증 인쇄하기</button>
        <button class="btn outline" onclick="copyReport()">📋 보고서 복사하기</button>
        <button class="btn outline" onclick="restartGame()">↺ 다시 플레이하기</button>
      </div>
    </div>

    <div class="print-report" style="display:none">
      <h2>Final Case Report</h2>
      <p><b>Detective:</b> ${escapeHTML(state.detectiveName)}</p>
      <p>${escapeHTML(state.report)}</p>
    </div>
  `);
}
function restartGame(){
  sfx("click");
  resetState();
  render();
}

/* INITIALIZE */
render();
</script>
</body>
</html>
